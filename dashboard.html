
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#090d1a">

    <meta name="description"
          content="LifeTrack - Your personal growth dashboard.">

    <title>LifeTrack | Dashboard</title>

    <!-- DASHBOARD CSS -->
    <link rel="stylesheet" href="dashboard.css">

    <!-- LUCIDE ICONS -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- APPLICATION -->
    <div class="app-container" id="appContainer">

        <!-- SIDEBAR WILL GO HERE -->
        
<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

    <!-- SIDEBAR HEADER -->
    <div class="sidebar-header">

        <a href="dashboard.html" class="sidebar-logo">
            LifeTrack<span>.</span>
        </a>

        <button class="sidebar-control"
                id="sidebarCollapseButton"
                aria-label="Collapse sidebar">
            <i data-lucide="panel-left-close"></i>
        </button>

        <button class="sidebar-close"
                id="sidebarCloseButton"
                aria-label="Close sidebar">
            <i data-lucide="x"></i>
        </button>

    </div>

    <!-- USER PROFILE -->
    <div class="sidebar-profile">

        <div class="profile-avatar" id="sidebarAvatar">
            U
        </div>

        <div class="profile-details">
            <strong id="sidebarUserName">Loading...</strong>
            <span id="sidebarPlan">Premium Member</span>
        </div>

    </div>

    <!-- NAVIGATION -->
    <nav class="sidebar-navigation"
         id="sidebarNavigation">

        <p class="nav-heading">WORKSPACE</p>

        <button class="nav-link active"
                data-section="overview">
            <i data-lucide="layout-dashboard"></i>
            <span>Overview</span>
        </button>

        <button class="nav-link" data-section="habits">
            <i data-lucide="target"></i>
            <span>My Habits</span>
        </button>

        <button class="nav-link" data-section="mood">
            <i data-lucide="smile"></i>
            <span>Mood Tracker</span>
        </button>

        <button class="nav-link" data-section="journal">
            <i data-lucide="book-open"></i>
            <span>My Journal</span>
        </button>

        <button class="nav-link" data-section="goals">
            <i data-lucide="flag"></i>
            <span>My Goals</span>
        </button>

        <button class="nav-link" data-section="calendar">
            <i data-lucide="calendar-days"></i>
            <span>Calendar</span>
        </button>

        <p class="nav-heading">GROWTH</p>

        <button class="nav-link" data-section="insights">
            <i data-lucide="chart-no-axes-combined"></i>
            <span>Insights</span>
        </button>

        <button class="nav-link" data-section="achievements">
            <i data-lucide="trophy"></i>
            <span>Achievements</span>
        </button>

        <button class="nav-link" data-section="rewards">
            <i data-lucide="gift"></i>
            <span>Rewards</span>
        </button>

        <button class="nav-link" data-section="challenges">
            <i data-lucide="swords"></i>
            <span>Challenges</span>
        </button>

        <button class="nav-link" data-section="notifications">
            <i data-lucide="bell"></i>
            <span>Notifications</span>
        </button>

        <p class="nav-heading">ACCOUNT</p>

        <button class="nav-link" data-page="ai-coach.html">
            <i data-lucide="bot"></i>
            <span>AI Coach</span>
        </button>

        <button class="nav-link" data-section="subscription">
            <i data-lucide="crown"></i>
            <span>Subscription</span>
        </button>

        <button class="nav-link" data-section="settings">
            <i data-lucide="settings"></i>
            <span>Settings</span>
        </button>

    </nav>

    <!-- SIDEBAR FOOTER -->
    <div class="sidebar-footer">

        <button class="logout-button" id="logoutButton">
            <i data-lucide="log-out"></i>
            <span>Sign Out</span>
        </button>

    </div>

</aside>

<!-- MOBILE SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>



        <!-- MAIN CONTENT -->
        <main class="main-content" id="mainContent">

            <!-- TOPBAR WILL GO HERE -->
            
<!-- TOPBAR -->
<header class="topbar">

    <div class="topbar-left">

        <!-- MOBILE MENU -->
        <button class="mobile-menu-button"
                id="mobileMenuButton"
                aria-label="Open navigation menu">
            <i data-lucide="menu"></i>
        </button>

        <!-- PAGE INFORMATION -->
        <div class="page-heading">
            <h1 id="pageTitle">Overview</h1>
            <p id="currentDate">Loading date...</p>
        </div>

    </div>

    <!-- TOPBAR ACTIONS -->
    <div class="topbar-actions">

        <button class="topbar-icon"
                id="notificationButton"
                aria-label="Notifications">
            <i data-lucide="bell"></i>
            <span class="notification-dot"></span>
        </button>

        <div class="topbar-divider"></div>

        <button class="topbar-profile"
                id="topbarProfile">
            <span class="topbar-avatar"
                  id="topbarAvatar">U</span>
        </button>

    </div>

</header>
<!-- END TOPBAR -->



            <!-- DASHBOARD CONTENT -->
            <div class="page-content" id="pageContent">

                <!-- DASHBOARD SECTIONS WILL GO HERE -->

            </div>
            <!-- END DASHBOARD CONTENT -->

        </main>
        <!-- END MAIN CONTENT -->

    </div>
    <!-- END APPLICATION -->


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <!-- DASHBOARD JAVASCRIPT -->
    <script src="dashboard.js"></script>

    <script>
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>

</body>
    </html>
