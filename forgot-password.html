
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | LifeTrack</title>

    <link rel="stylesheet" href="css/forgot-password.css">
</head>

<body>

    <header class="topbar">
        <a href="index.html" class="logo">
            LifeTrack<span>.</span>
        </a>

        <a href="auth.html" class="back-link">Back to Login</a>
    </header>

    <main class="recovery-container">

        <div class="recovery-card">

            <div class="recovery-heading">
                <span class="eyebrow">ACCOUNT SECURITY</span>

                <h1>Create New Password</h1>

                <p>Choose a new password for your LifeTrack account.</p>
            </div>

            <form id="resetPasswordForm" class="recovery-form">

                <label for="newPassword">New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >

                <button type="submit" id="resetButton">
                    Update Password
                </button>

            </form>

            <p id="resetMessage" role="status"></p>

        </div>

    </main>

    <footer>
        © 2026 LifeTrack. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/reset-password.js"></script>

</body>
</html>
